# CommitVault frontend — static SPA server (runs as conf.d/default.conf inside
# nginxinc/nginx-unprivileged, i.e. within the `http` context).
#
# The reverse proxy (Traefik) terminates TLS, sets HSTS and routes `/api` to
# the backend; this server only ever sees requests for the SPA and its assets.

# Hashed build assets are immutable; everything else (index.html, favicon,
# theme-init.js) must be revalidated so new deployments are picked up.
map $uri $cv_cache_control {
  default      "no-cache";
  ~^/assets/   "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # All response headers are declared here once. Do NOT add `add_header` inside
  # a location block: nginx would then drop every header inherited from here.
  add_header Cache-Control $cv_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Container health probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The API is routed to the backend by the reverse proxy. If a request for it
  # ever reaches this server the routing is misconfigured: fail loudly instead
  # of answering with index.html.
  location /api/ {
    default_type application/json;
    return 502 '{"error":{"code":"bad_gateway","message":"API requests must be routed to the backend."}}';
  }

  # Fingerprinted assets: a missing file is a real 404, never the SPA shell.
  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback: unknown paths are client-side routes.
  location / {
    try_files $uri /index.html;
  }

  # Never serve dotfiles.
  location ~ /\. {
    return 404;
  }
}
